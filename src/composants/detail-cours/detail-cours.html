@if (cours) {
  <aside class="detail-cours">
    <p class="sur-titre">DÉTAIL DU COURS</p>
    <h2>{{ cours.titre }}</h2>
    <p><strong>Catégorie :</strong> {{ cours.categorie }}</p>
    <p><strong>Durée :</strong> {{ cours.duree }}</p>
    <p><strong>Places disponibles :</strong> {{ cours.places }}</p>
  </aside>
} @else {
  <aside class="detail-cours detail-cours--vide">
    <div class="icone">i</div>
    <h2>Aucun cours sélectionné</h2>
    <p>Sélectionnez un cours dans la liste pour voir son détail.</p>
  </aside>
}
